name: Deploy to Cloudflare Pages

# Runs next to "Build & Push to GHCR" (the homelab image), which is unchanged.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID; without them the build still runs and the deploy is skipped.

on:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fail if any Git LFS pointer would ship
        run: |
          pointers=$(grep -rlI --exclude=.gitattributes '^version https://git-lfs' public || true)
          if [ -n "$pointers" ]; then
            echo "::error::Git LFS pointer files found under public/ (LFS objects not fetched):"
            echo "$pointers"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Vite build + prerendered /projects pages, then the Pages layout and _headers
      # (scripts/pages-dist.mjs also fails if the character model isn't a real glTF)
      - name: Build
        run: npm run build:pages

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set: skipping the Pages deploy"
            exit 0
          fi
          npx --yes wrangler@3.80.0 pages deploy dist --project-name=portfolio --branch=main --commit-hash="$GITHUB_SHA"
