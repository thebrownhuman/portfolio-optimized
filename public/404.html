<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050810" />
  <title>Page not found - Shivansh Mishra</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
  <style>
    @font-face {
      font-family: "Geist";
      src: url("/fonts/geist-latin-wght.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    html { background: #050810; color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      box-sizing: border-box;
      background: #050810;
      color: #eae5ec;
      font-family: "Geist", system-ui, sans-serif;
      text-align: center;
    }
    .code { margin: 0; font-size: 96px; font-weight: 700; line-height: 1; color: #5eead4; }
    h1 { margin: 0; font-size: 28px; font-weight: 500; }
    p { margin: 0; color: #a7a3b0; }
    a {
      margin-top: 16px;
      padding: 12px 28px;
      border: 1px solid #5eead4;
      border-radius: 100px;
      color: #5eead4;
      text-decoration: none;
      letter-spacing: 1px;
    }
    a:hover, a:focus-visible { background: #5eead4; color: #050810; outline: none; }
  </style>
</head>
<body>
  <p class="code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
