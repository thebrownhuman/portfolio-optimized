server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for Vite hashed assets (js, css, images in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Long cache for models and images (they don't change often)
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Self-hosted fonts and wasm: versioned by filename, safe to cache long
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # No cache for index.html (so deploys take effect immediately)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        # .glb/.hdr aren't in nginx's mime.types, so they go out as octet-stream;
        # meshopt and RGBE data still gzip well. woff2 is already compressed.
        # (No brotli: nginx:alpine ships without ngx_brotli.)
        model/gltf-binary
        application/octet-stream;

    # Security headers (see security-headers.conf for why this is an include)
    include /etc/nginx/snippets/security-headers.conf;
}
