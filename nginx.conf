# www -> apex. Traffic arrives from cloudflared as plain http on :8080, so the
# redirect names https itself; every other host (apex, test., localhost) goes
# to the main server below
server {
    listen 8080;
    server_name www.shivanshmishra.in;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://shivanshmishra.in$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: nginx would otherwise add its internal :8080
    absolute_redirect off;

    # The site is one page ("/" plus #anchors): "/" serves index.html, real files
    # are served as they are, and anything else is a real 404 (it used to get
    # index.html with a 200, which search engines index as duplicate pages)
    location = / {
    }

    location / {
        try_files $uri =404;
    }

    # Directories (/images/ etc.) have no index page: 404, not 403
    error_page 403 404 =404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Long cache for Vite hashed assets (js, css, images in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Long cache for models and images (they don't change often)
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Self-hosted fonts and wasm: versioned by filename, safe to cache long
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Resume: 404 if the file is missing instead of the SPA fallback serving index.html
    location = /resume.pdf {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # No cache for index.html (so deploys take effect immediately)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        # .glb/.hdr aren't in nginx's mime.types, so they go out as octet-stream;
        # meshopt and RGBE data still gzip well. woff2 is already compressed.
        # (No brotli: nginx:alpine ships without ngx_brotli.)
        model/gltf-binary
        application/octet-stream;

    # Security headers (see security-headers.conf for why this is an include)
    include /etc/nginx/snippets/security-headers.conf;
}
