# Old domain and www hosts -> https://shivanshmishra.com, path and query kept.
# Traffic arrives from cloudflared as plain http on :8080, so the redirect names
# https itself; every other host (.com, test., localhost) goes to the main server below
server {
    listen 8080;
    server_name shivanshmishra.in www.shivanshmishra.in www.shivanshmishra.com;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://shivanshmishra.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: nginx would otherwise add its internal :8080
    absolute_redirect off;

    # The site is one page ("/" plus #anchors): "/" serves index.html, real files
    # are served as they are, and anything else is a real 404 (it used to get
    # index.html with a 200, which search engines index as duplicate pages)
    location = / {
    }

    location / {
        try_files $uri =404;
    }

    # Prerendered project pages (scripts/build-projects.mjs): /projects and
    # /projects/<slug> are folders with an index.html; unknown slugs 404
    location /projects {
        try_files $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Crawler files: an hour
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /llms.txt {
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Directories (/images/ etc.) have no index page: 404, not 403
    error_page 403 404 =404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Every static type sends exactly one Cache-Control: no "expires" (it adds
    # a second header next to add_header's)

    # Vite's content-hashed files (js, css, the character model and HDR): a
    # new build gets new names, so they never change under a URL
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Images keep their names across deploys: a week, then revalidate in the background
    location /images/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Self-hosted fonts and wasm: versioned by filename, safe to cache long
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Resume: 404 if the file is missing instead of the SPA fallback serving index.html
    location = /resume.pdf {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html revalidates every time (so deploys take effect immediately);
    # one Cache-Control only (expires -1 used to add a second)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        # .glb/.hdr aren't in nginx's mime.types, so they go out as octet-stream;
        # meshopt and RGBE data still gzip well. woff2 is already compressed.
        # (No brotli: nginx:alpine ships without ngx_brotli.)
        model/gltf-binary
        application/octet-stream;

    # Security headers (see security-headers.conf for why this is an include)
    include /etc/nginx/snippets/security-headers.conf;
}
